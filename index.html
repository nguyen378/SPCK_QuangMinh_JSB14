<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script> 
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div class="background flex justify-center items-center">
        <div class="login-box">
            <form class="form-login" action="/html/home_main.html" method="get">
                <h2 class="tittle">Login</h2>
                <div class="tittle-user">Username/Email(*)</div>
                <div class="w-[350px]"><input class="username" type="input-box" placeholder="Username" required><i class="fa-solid fa-user" style="color: rgba(255,255,255,1);"></i></div>
                <div class="tittle-password">Password(*)</div>
                <div class="w-[350px]"><input class="password" type="input-box" placeholder="Password" required><i class="fa-solid fa-lock" style="color: rgba(255,255,255,1);"></i></div>
                <div class="remember">
                    <label class="checkbox-remember"><input class="tittle-remember" type="checkbox">Remember me</label>
                    <a class="forgot" href="#">Forgot password?</a>
                </div>
                <button class="login-btn">Log in</button>
                <div class="tittle-register">Don't have a account? <a class="register" href="/html/signin.html">Register</a></div>
            </form>
        </div>
    </div>

    <script src="/js/login.js"></script>
</body>
</html>
