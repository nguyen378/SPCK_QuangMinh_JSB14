<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script> 
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <link rel="stylesheet" href="/Portfocivi/SPCK-JSB14-QUANGMINH/css/login.css">
</head>
<body>
    <div class="background flex justify-center items-center">
        <div class="login-box">
            <form class="form-login" action="home_main.html" method="get">
                <h2 class="tittle">Signin</h2>
                <div class="tittle-user">Username/Email(*)</div>
                <div class="w-[350px]"><input class="username" type="input-box" placeholder="Username" required><i class="fa-solid fa-user" style="color: rgba(255,255,255,1);"></i></div>
                <div class="tittle-password">Email(*)</div>
                <div class="w-[350px]"><input class="email" type="input-box" placeholder="Email" required><i class="fa-solid fa-at" style="color: rgb(255, 255, 255);"></i></div>
                <div class="tittle-password">Password(*)</div>
                <div class="w-[350px]"><input id="password" class="password" type="password" placeholder="Password" required><i onclick="unlock(this)" class="fa-solid fa-lock" style="color: rgba(255,255,255,1);"></i></div>
                <div class="tittle-register">Already have an account? <a class="register" href="/Portfocivi/SPCK-JSB14-QUANGMINH/html/login.html">Login</a></div>
                <button class="login-btn">Sign in</button>
                <div class="inline-flex justify-center items-center h-[32px] w-full gap-[5px] mb-[10px] cursor-pointer">
                    <a href="#"><i class="icon fa-brands fa-google fa-2xl" style="color: rgb(255, 255, 255);"></i></a>
                    <a href="#"><i class="icon fa-brands fa-facebook fa-2xl" style="color: rgb(255, 255, 255);"></i></a>
                    <a href="#"><i class="icon fa-brands fa-github fa-2xl" style="color: rgb(255, 255, 255);"></i></a>
                </div>
            </form>
        </div>
    </div>

    <script src="/Portfocivi/SPCK-JSB14-QUANGMINH/js/login.js"></script>
</body>
</html>
